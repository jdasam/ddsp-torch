[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddsp-pytorch"
version = "0.1.0"
description = "DDSP: Differentiable Digital Signal Processing in PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "einops>=0.6.0",
    "pesto-pitch>=0.2.0",
    "crepe>=0.0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["ddsp"]
